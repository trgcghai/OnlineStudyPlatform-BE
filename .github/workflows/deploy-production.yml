name: Backend production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --runInBand
      - run: pnpm build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure known hosts
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Pull and rebuild backend
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          COMPOSE_PATH: ${{ vars.VPS_COMPOSE_PATH }}
          REPO_PATH: ${{ vars.VPS_REPO_PATH }}
          COMPOSE_SERVICE: ${{ vars.VPS_COMPOSE_SERVICE }}
        run: |
          set -Eeuo pipefail
          ssh -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -s -- $(printf '%q' "$COMPOSE_PATH") $(printf '%q' "$REPO_PATH") $(printf '%q' "$COMPOSE_SERVICE")" <<'REMOTE'
          set -Eeuo pipefail
          COMPOSE_PATH=$1
          REPO_PATH=$2
          COMPOSE_SERVICE=$3

          if [[ "$COMPOSE_PATH" == "~/"* ]]; then
            COMPOSE_PATH="$HOME/${COMPOSE_PATH#~/}"
          fi

          on_failure() {
            status=$?
            cd "$COMPOSE_PATH" 2>/dev/null || true
            docker compose ps "$COMPOSE_SERVICE" || true
            docker compose logs --tail=100 "$COMPOSE_SERVICE" || true
            exit "$status"
          }
          trap on_failure ERR

          git -C "$REPO_PATH" fetch origin main
          git -C "$REPO_PATH" checkout main
          git -C "$REPO_PATH" pull --ff-only origin main
          cd "$COMPOSE_PATH"
          docker compose up -d --build "$COMPOSE_SERVICE"
          docker compose ps "$COMPOSE_SERVICE"
          trap - ERR
          REMOTE
